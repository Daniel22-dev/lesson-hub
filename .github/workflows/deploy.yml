name: Lesson Hub Verify and Deploy

on:
  workflow_run:
    workflows: ["P5 R2 pre-production release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-hub-pages-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      app_version: ${{ steps.release-identity.outputs.app_version }}
      artifact_digest: ${{ steps.release-identity.outputs.artifact_digest }}
      manifest_sha256: ${{ steps.release-identity.outputs.manifest_sha256 }}
      sbom_sha256: ${{ steps.release-identity.outputs.sbom_sha256 }}
      evidence_manifest_sha256: ${{ steps.release-identity.outputs.evidence_manifest_sha256 }}
      build_provenance_sha256: ${{ steps.release-identity.outputs.build_provenance_sha256 }}
      assurance_mode: ${{ steps.release-identity.outputs.assurance_mode }}
      release_stage: ${{ steps.release-identity.outputs.release_stage }}
      garp_profile: ${{ steps.release-identity.outputs.garp_profile }}
      gate: ${{ steps.release-identity.outputs.gate }}
      source_sha: ${{ steps.release-source.outputs.source_sha }}
    steps:
      - name: Resolve verified source SHA
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then source_sha="${{ github.event.workflow_run.head_sha }}"; else source_sha="${{ github.sha }}"; fi
          if ! [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "::error::Invalid release source SHA."; exit 1; fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-source.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Dependency audit
        run: npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          GHRAB_VISUAL_ATTEMPTS: 3
          GHRAB_VISUAL_SCREENSHOT_ATTEMPTS: 3
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci
      - name: Set deterministic build time
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Enforce full GARP 2.5.1 release gate
        run: npm run qa:garp25:static
      - name: Verify AI Studio dispatch credential
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deployment is blocked because AI Studio could not be notified safely."; exit 1; fi
      - name: Build hygienic GitHub Pages artifact
        run: npm run build:pages
      - name: Prepare canonical Pages artifact and exact release identity
        run: npm run prepare:pages
        env:
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_SOURCE_COMMIT: ${{ steps.release-source.outputs.source_sha }}
          GHRAB_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GHRAB_RELEASE_STAGE: LIVE-PUBLIC-PAGES
      - name: Verify complete release chain
        run: npm run verify:release-chain
      - name: Export verified release identity
        id: release-identity
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const integrity = JSON.parse(fs.readFileSync('dist-pages/release-integrity.json', 'utf8'));
          const required = {
            app_version: integrity.version,
            artifact_digest: integrity.artifactDigest,
            manifest_sha256: integrity.manifestSha256,
            sbom_sha256: integrity.sbomSha256,
            evidence_manifest_sha256: integrity.evidenceManifestSha256,
            build_provenance_sha256: integrity.buildProvenanceSha256,
            assurance_mode: integrity.assuranceMode,
            release_stage: integrity.releaseStage,
            garp_profile: integrity.garpProfile,
            gate: integrity.gate,
          };
          if (integrity.releaseStage !== 'LIVE-PUBLIC-PAGES') { console.error(`::error::Release record is not a live Pages release (${integrity.releaseStage}).`); process.exit(1); }
          const missing = Object.entries(required).filter(([, value]) => !value).map(([key]) => key);
          if (missing.length) { console.error(`::error::Release identity incomplete: ${missing.join(', ')}`); process.exit(1); }
          for (const [key, value] of Object.entries(required)) {
            if (/\r|\n/.test(String(value))) { console.error('::error::Release identity output must be single-line.'); process.exit(1); }
            process.stdout.write(`${key}=${value}\n`);
          }
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-pages
          include-hidden-files: true

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: release-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wait before Pages retry 2
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Wait before Pages retry 3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_3
        if: steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Enforce successful Pages deployment
        if: steps.deployment_1.outcome != 'success' && steps.deployment_2.outcome != 'success' && steps.deployment_3.outcome != 'success'
        run: |
          echo "::error::GitHub Pages deployment failed after 3 bounded attempts."
          exit 1

  notify-ai-studio:
    needs: [release-build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-build.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Verify the live release before notifying AI Studio
        env:
          GHRAB_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          GHRAB_LIVE_APP_ID: lesson-hub
          GHRAB_LIVE_VERSION: ${{ needs.release-build.outputs.app_version }}
          GHRAB_LIVE_SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          GHRAB_LIVE_ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          GHRAB_LIVE_MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          GHRAB_LIVE_OUT: ${{ runner.temp }}/live-release.json
        run: npm run verify:live-release
      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source_sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          APP_VERSION: ${{ needs.release-build.outputs.app_version }}
          ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact_digest }}
          MANIFEST_SHA256: ${{ needs.release-build.outputs.manifest_sha256 }}
          SBOM_SHA256: ${{ needs.release-build.outputs.sbom_sha256 }}
          EVIDENCE_MANIFEST_SHA256: ${{ needs.release-build.outputs.evidence_manifest_sha256 }}
          BUILD_PROVENANCE_SHA256: ${{ needs.release-build.outputs.build_provenance_sha256 }}
          ASSURANCE_MODE: ${{ needs.release-build.outputs.assurance_mode }}
          RELEASE_STAGE: ${{ needs.release-build.outputs.release_stage }}
          GARP_PROFILE: ${{ needs.release-build.outputs.garp_profile }}
          RELEASE_GATE: ${{ needs.release-build.outputs.gate }}
          LIVE_RELEASE_FILE: ${{ runner.temp }}/live-release.json
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Dispatch is fail-closed."; exit 1; fi
          node scripts/build-ai-studio-dispatch.mjs "$LIVE_RELEASE_FILE" "$RUNNER_TEMP/ai-studio-dispatch.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"
          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
