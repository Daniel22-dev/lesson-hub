name: Manual visual and browser smoke

on:
  pull_request:
    branches: [candidate]
    paths:
      - "scripts/qa-manual-browser.mjs"
      - ".github/workflows/manual-browser-qa.yml"
      - "public/manual/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Download SHA-pinned shared PDF exporter
        run: |
          mkdir -p qa-results/manual-browser
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Daniel22-dev/AI-Studio-GHRAB/76bc629619ea74fdec2f7cace6fc185bf86950fe/src/manualy/pdf-export.js -o qa-results/manual-browser/shared-pdf-export.js
      - name: Install PDF render and extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test manual UI with Playwright
        env:
          MANUAL_WEBROOT: "public"
          MANUAL_APP_NAME: "lesson-hub"
        run: node scripts/qa-manual-browser.mjs
      - name: Preserve UI screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-browser-${{ github.sha }}
          path: qa-results/manual-browser/
          if-no-files-found: warn
          retention-days: 14
