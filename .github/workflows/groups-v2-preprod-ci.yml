name: Lesson Hub Groups v2 isolated preproduction CI (NO DEPLOY)

on:
  pull_request:
    branches: [preprod/groups-v2-clean-20261028]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoped-groups-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groups-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build and test exact Groups v2 Draft source
        run: |
          npm run build
          npm run test:canonical-groups
          npm run test:studio-dispatch
