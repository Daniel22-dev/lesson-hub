name: Manual navigation and access contract

on:
  pull_request:
    branches: [candidate]
    paths:
      - "public/manual/navigation-context.js"
      - "public/manual/navigation-context.css"
      - "scripts/qa-manual-navigation.test.mjs"
      - ".github/workflows/manual-navigation-qa.yml"
  push:
    branches: [candidate]
    paths:
      - "public/manual/navigation-context.js"
      - "public/manual/navigation-context.css"
      - "scripts/qa-manual-navigation.test.mjs"
      - ".github/workflows/manual-navigation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check navigation module with Node core
        env:
          MANUAL_NAV_JS: "public/manual/navigation-context.js"
        run: node --test scripts/qa-manual-navigation.test.mjs
