name: Lesson Hub v2 complete GARP foundation and P5 (NO DEPLOY)
on:
  push:
    branches: [qa/groups-v2-full-p5-20261028]
permissions:
  contents: read
jobs:
  full-source-p5:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact review SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Assert only QA workflow differs from reviewed v2 app source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f7355364c7604f7c16887a4b6d6a665bc7d9c475"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only "f7355364c7604f7c16887a4b6d6a665bc7d9c475" HEAD)" = ".github/workflows/groups-v2-full-p5-preprod.yml"
      - name: Node 22 and locked npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Check pinned audit tools
        run: |
          node -e "if(require('./node_modules/axe-core/package.json').version!=='4.12.1')process.exit(1)"
          node -e "if(require('./node_modules/playwright/package.json').version!=='1.61.1')process.exit(1)"
      - name: Supply chain advisory audit
        run: |
          npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org
      - name: Provision actual headless Chromium for P5
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Execute complete groups, GARP P5 and foundation (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm run test:canonical-groups
          npm run qa:p5:ci
          npm run qa:garp27:foundation
      - name: Retain source-bound validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-full-p5-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json
            audit-evidence/garp27-current/
            qa-results/
