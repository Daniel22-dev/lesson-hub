name: Stage04 temporary QA diagnosis

on:
  push:
    branches:
      - fix/lesson-hub-127-header-overflow-20261023

permissions:
  contents: read

concurrency:
  group: stage04-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use project Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build exact branch
        run: npm run build
      - name: Isolate server API regression
        continue-on-error: true
        run: node server/test-server.mjs
      - name: Isolate client integration regression
        continue-on-error: true
        run: node server/test-client-integration.mjs
      - name: Execute unchanged technical QA
        id: technical
        continue-on-error: true
        run: npm run qa:technical
      - name: Print sanitized technical findings
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f qa-results/technical.json ]; then echo 'TECHNICAL_REPORT_MISSING'; exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('qa-results/technical.json', 'utf8'));
          console.log('GHRAB_TECHNICAL_STATUS:', report.status);
          for (const issue of report.findings || []) {
            console.log('GHRAB_TECHNICAL_FINDING:', issue.severity, issue.code, issue.message);
            if (issue.code === 'SERVER_TEST_FAILED') console.log('GHRAB_SERVER_TEST_STDERR:', String(issue.evidence || '').slice(0, 1200));
          }
          if (report.status !== 'PASS') process.exitCode = 1;
          NODE
      - name: Install pinned Chromium for targeted QA
        if: always()
        run: npx playwright install chromium
      - name: Run targeted 1366px editor layout regressions
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GHRAB_VISUAL_ATTEMPTS: '2'
          GHRAB_VISUAL_SCREENSHOT_ATTEMPTS: '2'
          GHRAB_VISUAL_BROWSER_BATCH: '3'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'qa/visual-plan.json';
          const plan = JSON.parse(fs.readFileSync(file, 'utf8'));
          const exact = new Set(['lesson-hub-lesson-editor','lesson-hub-quick-record','lesson-hub-material-editor']);
          plan.scenarios = plan.scenarios.filter(x => exact.has(x.id)).map(x => ({...x, viewports: [{width:1366,height:768}]}));
          if (plan.scenarios.length !== 3) throw new Error('Expected exactly 3 editor scenarios');
          fs.writeFileSync(file, JSON.stringify(plan,null,2)+'\n');
          console.log('STAGE04_TARGETED_SCENARIOS:',plan.scenarios.map(x=>x.id));
          NODE
          npm run qa:visual
      - name: Print targeted visual QA result
        if: always()
        shell: bash
        run: |
          if [ ! -f qa-results/visual.json ]; then echo 'VISUAL_REPORT_MISSING'; exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('qa-results/visual.json','utf8'));
          console.log('GHRAB_VISUAL_STATUS:',report.status, 'total_findings:',(report.findings||[]).length);
          for (const f of report.findings||[]) console.log('GHRAB_VISUAL_FINDING:', f.message);
          if (report.status !== 'PASS') process.exitCode=1;
          NODE
      - name: Preserve sanitized QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage04-technical-diagnosis
          path: qa-results/technical.json
          retention-days: 3
          if-no-files-found: warn
